name: Build Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Production Keystore
        run: |
          keytool -genkey -v -keystore release.jks -keyalg RSA -keysize 2048 -validity 10000 -alias releasekey -storepass password123 -keypass password123 -dname "CN=Developer, OU=App, O=Mobile, L=Jaipur, ST=Rajasthan, C=IN"

      - name: Build and Sign Release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=../release.jks \
            -Pandroid.injected.signing.store.password=password123 \
            -Pandroid.injected.signing.alias=releasekey \
            -Pandroid.injected.signing.key.password=password123

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/app-release.apk
